name: De novo tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest==8.3.5
      - run: python -m pytest tests/test_trgt_hypotheses.py tests/test_trio_*.py -q --ignore=tests/test_trio_pipeline.py --ignore=tests/test_trio_prepare_io.py
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          curl -fL --retry 3 https://github.com/lh3/minimap2/releases/download/v2.31/minimap2-2.31_x64-linux.tar.bz2 -o /tmp/mm2.tar.bz2
          tar -xjf /tmp/mm2.tar.bz2 -C /tmp
          sudo install /tmp/minimap2-2.31_x64-linux/minimap2 /usr/local/bin/minimap2
      - run: python -m pip install . pytest==8.3.5
      - run: python -m pytest tests/test_trio_pipeline.py tests/test_trio_prepare_io.py tests/test_denovo_cli.py tests/test_minimum_variant_length.py -q
      - run: minisv denovo --help && minisv extract --help
